<div class="login-card">
  <div class="card-header">
    <div class="brand-logo" style="padding: 0; overflow: hidden; width: 48px; height: 48px; border-radius: 50%; margin: 0 auto 16px auto; border: 2px solid rgba(255,255,255,0.1);">
      <img src="/logo.jpg" alt="Engineering Tadka Logo" style="width: 100%; height: 100%; object-fit: cover;">
    </div>
    <h2>Welcome Back</h2>
    <p>Sign in to manage your restaurant outlets</p>
  </div>

  <div *ngIf="errorMessage()" class="error-banner animate-slide-in">
    <span class="error-icon">⚠️</span>
    <span class="error-text">{{ errorMessage() }}</span>
  </div>

  <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="auth-form">
    <div class="form-group">
      <label for="email">Email Address</label>
      <div class="input-wrapper">
        <span class="input-icon">✉️</span>
        <input 
          type="email" 
          id="email" 
          name="email" 
          [(ngModel)]="email" 
          placeholder="admin@engineeringtadka.com"
          required 
          autocomplete="email"
        />
      </div>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <div class="input-wrapper">
        <span class="input-icon">🔒</span>
        <input 
          type="password" 
          id="password" 
          name="password" 
          [(ngModel)]="password" 
          placeholder="••••••••"
          required
          autocomplete="current-password"
        />
      </div>
    </div>

    <button type="submit" [disabled]="loading() || !loginForm.valid" class="btn-submit">
      <span *ngIf="loading()" class="spinner"></span>
      <span *ngIf="!loading()">Login</span>
    </button>
  </form>

  <div class="card-footer">
    <p>Don't have an account? <a routerLink="/register">Register here</a></p>
  </div>
</div>
